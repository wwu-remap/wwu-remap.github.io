site_name: ReMAP
theme:
  name: material
  icon:
    logo: material/library
  palette:
    primary: indigo
    accent: indigo
  features:
    - content.tabs.link

nav:
  - index.md
  - privacy-policy.md
  - account-deletion.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
